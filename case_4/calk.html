<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calk.css">
    <title>Калькулятор</title>
</head>
<body>
    <div class="calk" id="calk">
        <h1>Калькулятор</h1>
        <div class="val">
            <input type="text" name="val1" id="val1">
            <input type="text" name="val2" id="val2"> 
        </div>
        <div class="buttons" id="buttons">
            <button class="plus" id="plus">+</button>
            <button class="minus" id="minus">-</button>
            <button class="mult" id="mult">*</button>
            <button class="division" id="division">/</button>
        </div>

        <span class="result" id="result"></span>
    </div>
    <script src="calk.js"></script>
</body>
</html>
